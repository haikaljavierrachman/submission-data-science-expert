version: '3.8'

services:
  db:
    image: postgres:15
    container_name: some-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespasswd
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - metabase_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:v0.46.4
    container_name: metabase_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      # POIN PENTING: Arahkan ke folder /metabase-data/
      # JANGAN tambahkan .mv.db di sini
      MB_DB_FILE: /metabase-data/metabase.db 
      MB_JETTY_PORT: 3000
    networks:
      - metabase_network
    volumes:
      # Kuncinya di sini: Kita mapping folder SAAT INI (.) 
      # ke dalam folder /metabase-data di dalam container
      - .:/metabase-data
    depends_on:
      - db

networks:
  metabase_network:
    driver: bridge

volumes:
  postgres_data: